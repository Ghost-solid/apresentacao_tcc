services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ds_legacy}
      POSTGRES_USER: ${POSTGRES_USER:-ds_legacy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env.docker}
    volumes:
      - ds_legacy_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      NODE_ENV: production
      PORT: 8000
      SESSION_HOURS: ${SESSION_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ds_legacy}
      DB_USER: ${POSTGRES_USER:-ds_legacy}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env.docker}
      DB_SSL: "false"
      LIBRARIAN_USERNAME: ${LIBRARIAN_USERNAME:-biblioteca}
      LIBRARIAN_PASSWORD: ${LIBRARIAN_PASSWORD:?Defina LIBRARIAN_PASSWORD no arquivo .env.docker}
      LIBRARIAN_NAME: ${LIBRARIAN_NAME:-Responsável da Biblioteca}
      DIRECTOR_USERNAME: ${DIRECTOR_USERNAME:-diretor}
      DIRECTOR_PASSWORD: ${DIRECTOR_PASSWORD:?Defina DIRECTOR_PASSWORD no arquivo .env.docker}
      DIRECTOR_NAME: ${DIRECTOR_NAME:-Diretor}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8000:8000"

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-ds_legacy}
      PGDATABASE: ${POSTGRES_DB:-ds_legacy}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backups/automatic:/backups
      - ./scripts/automatic-backup.sh:/scripts/automatic-backup.sh:ro
    entrypoint: ["/bin/sh", "/scripts/automatic-backup.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/last-success && test $$(($$(date +%s) - $$(cat /backups/last-success))) -lt $$((BACKUP_INTERVAL_SECONDS + 600))"]
      interval: 60s
      timeout: 5s
      start_period: 120s
      retries: 3

volumes:
  ds_legacy_postgres:
