services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ds_legacy
      POSTGRES_USER: ds_legacy
      POSTGRES_PASSWORD: altere-esta-senha
    volumes:
      - ds_legacy_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds_legacy -d ds_legacy"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      COOKIE_SECURE: "false"
      DATABASE_URL: postgresql://ds_legacy:altere-esta-senha@postgres:5432/ds_legacy
      DB_SSL: "false"
      LIBRARIAN_USERNAME: testebiblioteca
      LIBRARIAN_PASSWORD: troque-esta-senha-biblioteca
      LIBRARIAN_NAME: Responsável da Biblioteca
      DIRECTOR_USERNAME: testediretor
      DIRECTOR_PASSWORD: troque-esta-senha-diretor
      DIRECTOR_NAME: Diretor
    ports:
      - "8000:8000"

volumes:
  ds_legacy_postgres:
